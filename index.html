<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1cb0f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LinguaLearn 🔵</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22LinguaLearn%22,%22short_name%22:%22LinguaLearn%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%231cb0f6%22,%22theme_color%22:%22%231cb0f6%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%2780%27%20font-size%3D%2780%27%3E%F0%9F%90%A6%3C%2Ftext%3E%3C%2Fsvg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  :root {
    /* === AZUL PRINCIPAL === */
    --blue: #1cb0f6;
    --blue-dark: #1899d6;
    --blue-darker: #0e6fa3;
    --blue-light: #d5f0ff;
    --blue-lighter: #eaf8ff;
    --blue-glow: rgba(28,176,246,0.35);
    
    /* === NAVY (textos escuros e detalhes) === */
    --navy: #0a2540;
    --navy-soft: #1a3a5c;
    
    /* === SECUNDÁRIAS === */
    --cyan: #00c2ff;
    --cyan-dark: #00a5db;
    --teal: #00d4c8;
    --purple: #7b6ef6;
    --indigo: #4c5fd5;
    
    /* === FEEDBACK === */
    --green: #22c55e;
    --green-dark: #16a34a;
    --green-light: #d1fae5;
    --red: #ef4444;
    --red-dark: #dc2626;
    --red-light: #fee2e2;
    --yellow: #fbbf24;
    --yellow-dark: #d97706;
    --yellow-light: #fef3c7;
    --orange: #f97316;
    
    /* === NEUTROS === */
    --gray: #e2e8f0;
    --gray-mid: #94a3b8;
    --gray-dark: #64748b;
    --text: #0f172a;
    --text-light: #64748b;
    --bg: #ffffff;
    --bg-alt: #f1f7fb;
    --shadow: rgba(10,37,64,0.08);
    --shadow-strong: rgba(10,37,64,0.15);
  }

  [data-theme="dark"] {
    --blue: #2bc0ff;
    --blue-dark: #1cb0f6;
    --blue-light: #0d3a54;
    --blue-lighter: #0a2a3d;
    --blue-glow: rgba(43,192,255,0.3);
    
    --navy: #e6f4ff;
    --navy-soft: #b8d9ee;
    
    --gray: #1e3a52;
    --gray-mid: #52657a;
    --gray-dark: #8ea6bb;
    --text: #f0f7fc;
    --text-light: #94b0c7;
    --bg: #071a2b;
    --bg-alt: #0d2538;
    --shadow: rgba(0,0,0,0.5);
    --shadow-strong: rgba(0,0,0,0.7);
    
    --green-light: #0d3d22;
    --red-light: #4a1414;
    --yellow-light: #4a3708;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* =================== BACKGROUND DECORATIVO =================== */
  .bg-decor {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0; overflow: hidden;
    opacity: 0.5;
  }
  .bg-decor::before, .bg-decor::after {
    content: ''; position: absolute;
    border-radius: 50%; filter: blur(80px);
    opacity: 0.35;
  }
  .bg-decor::before {
    width: 400px; height: 400px;
    background: var(--blue);
    top: -150px; right: -100px;
    animation: floatBlob 20s ease-in-out infinite;
  }
  .bg-decor::after {
    width: 350px; height: 350px;
    background: var(--cyan);
    bottom: -120px; left: -100px;
    animation: floatBlob 25s ease-in-out infinite reverse;
  }
  @keyframes floatBlob {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(30px,-20px) scale(1.1); }
    66% { transform: translate(-20px,30px) scale(0.9); }
  }

  /* =================== TOPBAR =================== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 2px solid var(--gray);
    padding: 0.7rem 1rem;
    display: flex; justify-content: space-between; align-items: center;
    gap: 0.8rem;
  }
  [data-theme="dark"] .topbar { background: rgba(7,26,43,0.9); }

  .topbar-left { display: flex; align-items: center; gap: 0.7rem; }
  .back-btn {
    background: none; border: none;
    font-size: 1.4rem; cursor: pointer;
    color: var(--gray-dark); padding: 0.3rem 0.5rem;
    display: none; border-radius: 8px;
  }
  .back-btn.visible { display: block; }
  .back-btn:hover { background: var(--bg-alt); }

  .logo-mini {
    display: flex; align-items: center; gap: 0.4rem;
    font-weight: 900; font-size: 1.15rem;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    cursor: pointer;
    letter-spacing: -0.3px;
  }

  .topbar-right { display: flex; gap: 0.5rem; align-items: center; }
  .stat {
    display: flex; align-items: center; gap: 0.25rem;
    font-weight: 800; font-size: 0.95rem;
    padding: 0.35rem 0.55rem; border-radius: 10px;
    background: var(--bg-alt);
  }
  .stat.hearts { color: var(--red); }
  .stat.streak { color: var(--orange); }
  .stat.gems { color: var(--blue); }
  .stat.xp { color: var(--yellow-dark); }
  .icon-btn {
    background: var(--bg-alt); border: none;
    font-size: 1.1rem; cursor: pointer;
    padding: 0.4rem 0.55rem; border-radius: 10px;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--blue-light); transform: scale(1.05); }

  /* =================== SCREENS =================== */
  .screen {
    display: none; padding: 1.5rem 1rem 5rem;
    max-width: 640px; margin: 0 auto;
    position: relative; z-index: 1;
  }
  .screen.active { display: block; animation: fadeIn 0.35s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* =================== MASCOTE =================== */
  .mascot-container {
    width: 150px; height: 150px;
    margin: 0 auto 1rem;
    animation: bounce 2.5s ease-in-out infinite;
    filter: drop-shadow(0 12px 25px var(--blue-glow));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
  }
  .mascot-container svg { width: 100%; height: 100%; }

  /* =================== HOME =================== */
  .hero { text-align: center; padding: 1rem 0.5rem 2rem; }
  .hero h1 {
    font-size: 2.1rem; margin-bottom: 0.4rem; font-weight: 900;
    background: linear-gradient(135deg, var(--blue), var(--cyan), var(--purple));
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: gradientShift 6s ease infinite;
    letter-spacing: -0.5px;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .hero p { color: var(--text-light); font-size: 1rem; margin-bottom: 1.5rem; font-weight: 500; }

  .lang-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
  .lang-btn {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 20px; padding: 1.3rem 0.8rem;
    cursor: pointer; text-align: center;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 0 var(--gray);
    position: relative; color: var(--text); overflow: hidden;
  }
  .lang-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    opacity: 0; transition: opacity 0.3s;
  }
  .lang-btn:hover {
    transform: translateY(-3px);
    border-color: var(--blue);
    box-shadow: 0 7px 0 var(--blue), 0 10px 25px var(--blue-glow);
  }
  .lang-btn:hover::before { opacity: 0.06; }
  .lang-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--blue); }
  .lang-btn > * { position: relative; z-index: 1; }
  .lang-btn .flag { font-size: 2.8rem; display: block; margin-bottom: 0.4rem; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15)); }
  .lang-btn .name { font-weight: 900; font-size: 1.05rem; letter-spacing: -0.3px; }
  .lang-btn .progress-mini {
    font-size: 0.72rem; color: var(--text-light);
    margin-top: 0.4rem; font-weight: 700;
  }
  .lang-btn .crown-badge {
    position: absolute; top: -8px; right: -8px;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: white; font-size: 0.72rem; font-weight: 900;
    padding: 0.25rem 0.55rem; border-radius: 20px;
    border: 2px solid var(--bg);
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  /* =================== TRILHA =================== */
  .trail-header {
    background: linear-gradient(135deg, var(--blue), var(--cyan-dark), var(--indigo));
    background-size: 200% 200%;
    animation: gradientShift 8s ease infinite;
    color: white; border-radius: 24px;
    padding: 1.5rem; margin-bottom: 1.5rem;
    box-shadow: 0 12px 30px var(--blue-glow);
    position: relative; overflow: hidden;
  }
  .trail-header::before {
    content: ''; position: absolute;
    top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
    border-radius: 50%;
  }
  .trail-header h2 { font-size: 1.4rem; margin-bottom: 0.4rem; font-weight: 900; position: relative; }
  .trail-header p { opacity: 0.95; font-size: 0.9rem; position: relative; }
  .trail-header .stats-row {
    display: flex; gap: 1rem; margin-top: 1rem;
    padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.25);
    position: relative;
  }
  .trail-header .stats-row div { flex: 1; text-align: center; }
  .trail-header .stats-row strong { display: block; font-size: 1.3rem; font-weight: 900; }
  .trail-header .stats-row span { font-size: 0.72rem; opacity: 0.9; font-weight: 600; }

  .trail { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; padding: 1rem 0 4rem; }
  .lesson-node {
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--gray); border: none;
    color: white; font-size: 1.6rem; font-weight: 900;
    cursor: pointer; box-shadow: 0 6px 0 var(--gray-mid);
    transition: all 0.15s; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .lesson-node.unlocked {
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    box-shadow: 0 6px 0 var(--blue-dark), 0 8px 20px var(--blue-glow);
  }
  .lesson-node.unlocked:hover { transform: translateY(-3px); filter: brightness(1.1); }
  .lesson-node.unlocked:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }
  .lesson-node.completed {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    box-shadow: 0 6px 0 var(--yellow-dark), 0 8px 20px rgba(251,191,36,0.35);
  }
  .lesson-node.locked { cursor: not-allowed; opacity: 0.55; }
  .node-offset-1 { transform: translateX(-40px); }
  .node-offset-2 { transform: translateX(40px); }
  .node-label {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%); margin-top: 0.3rem;
    font-size: 0.68rem; color: var(--text-light);
    font-weight: 800; white-space: nowrap;
  }
  .node-xp-badge {
    position: absolute; top: -6px; right: -6px;
    background: linear-gradient(135deg, var(--purple), var(--indigo));
    color: white; font-size: 0.62rem; font-weight: 900;
    padding: 0.18rem 0.45rem; border-radius: 20px;
    border: 2px solid var(--bg);
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  /* =================== LIÇÃO =================== */
  .lesson-screen {
    padding: 0 !important; max-width: 100% !important;
    display: none; flex-direction: column; min-height: 100vh;
    background: var(--bg); position: relative; z-index: 1;
  }
  .lesson-screen.active { display: flex; }
  .lesson-progress-bar {
    height: 14px; background: var(--gray);
    border-radius: 10px; margin: 1rem 1rem 0;
    overflow: hidden; position: relative;
  }
  .lesson-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--cyan), var(--blue));
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
    border-radius: 10px; transition: width 0.4s ease;
    box-shadow: 0 0 12px var(--blue-glow);
  }
  @keyframes shimmer {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }
  .lesson-content { flex: 1; padding: 1.5rem 1.2rem; max-width: 600px; margin: 0 auto; width: 100%; }
  .lesson-sub {
    color: var(--text-light); font-size: 0.85rem;
    margin-bottom: 1rem; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .lesson-sub .combo-badge {
    background: linear-gradient(135deg, var(--orange), var(--red));
    color: white; padding: 0.2rem 0.6rem; border-radius: 20px;
    font-size: 0.75rem; font-weight: 900;
    animation: pulse 0.5s;
    box-shadow: 0 3px 10px rgba(249,115,22,0.4);
  }
  @keyframes pulse {
    0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); }
  }

  .exercise-prompt {
    font-size: 1.15rem; font-weight: 900;
    margin-bottom: 1.2rem; color: var(--navy);
    display: flex; align-items: center; gap: 0.5rem;
    letter-spacing: -0.2px;
  }
  [data-theme="dark"] .exercise-prompt { color: var(--text); }
  .exercise-prompt .icon {
    font-size: 1.4rem;
    background: var(--blue-light); padding: 0.3rem 0.5rem;
    border-radius: 10px;
  }

  .audio-btn-big {
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    color: white; border: none;
    width: 110px; height: 110px; border-radius: 24px;
    font-size: 2.6rem; cursor: pointer;
    box-shadow: 0 6px 0 var(--blue-dark), 0 10px 25px var(--blue-glow);
    transition: all 0.15s; display: block; margin: 0 auto 1rem;
  }
  .audio-btn-big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-dark); }
  .audio-btn-big.playing { animation: pulse-audio 0.6s infinite; }
  @keyframes pulse-audio {
    0% { transform: scale(1); box-shadow: 0 6px 0 var(--blue-dark), 0 10px 25px var(--blue-glow); }
    50% { transform: scale(1.06); box-shadow: 0 6px 0 var(--blue-dark), 0 15px 40px var(--blue-glow); }
    100% { transform: scale(1); }
  }

  .options { display: grid; gap: 0.8rem; }
  .option {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 16px; padding: 1rem 1.1rem;
    cursor: pointer; text-align: left;
    font-size: 1rem; font-weight: 600;
    color: var(--text); box-shadow: 0 4px 0 var(--gray);
    transition: all 0.15s; display: flex; align-items: center; gap: 0.7rem;
  }
  .option .num {
    background: var(--bg-alt); border: 2px solid var(--gray);
    border-radius: 8px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 900;
    color: var(--gray-dark); flex-shrink: 0;
  }
  .option:hover:not(:disabled) {
    border-color: var(--blue);
    background: var(--blue-lighter);
    box-shadow: 0 4px 0 var(--blue);
  }
  .option:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue); }
  .option.correct {
    background: var(--green-light); border-color: var(--green);
    color: var(--green-dark);
    box-shadow: 0 4px 0 var(--green);
  }
  .option.correct .num { border-color: var(--green); color: var(--green-dark); }
  .option.wrong {
    background: var(--red-light); border-color: var(--red);
    color: var(--red-dark);
    box-shadow: 0 4px 0 var(--red);
  }
  .option.wrong .num { border-color: var(--red); color: var(--red-dark); }
  .option:disabled { cursor: default; }

  /* Word bank */
  .word-bank-area {
    min-height: 66px; border-bottom: 2px solid var(--gray);
    border-top: 2px solid var(--gray); padding: 0.8rem 0;
    margin-bottom: 1.2rem; display: flex; flex-wrap: wrap;
    gap: 0.5rem; align-content: flex-start;
  }
  .word-bank { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .word-chip {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 12px; padding: 0.55rem 0.9rem;
    font-size: 0.95rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 3px 0 var(--gray);
    color: var(--text); transition: all 0.15s;
  }
  .word-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gray); }
  .word-chip.used { opacity: 0.25; pointer-events: none; }
  .word-chip.placed {
    background: var(--blue-light); border-color: var(--blue);
    color: var(--blue-darker); box-shadow: 0 3px 0 var(--blue);
  }

  /* Input */
  .type-input {
    width: 100%; padding: 1rem;
    border: 2px solid var(--gray); border-radius: 16px;
    font-size: 1rem; font-weight: 700;
    background: var(--bg); color: var(--text);
    box-shadow: 0 4px 0 var(--gray);
    outline: none; transition: all 0.2s;
  }
  .type-input:focus { border-color: var(--blue); box-shadow: 0 4px 0 var(--blue), 0 0 0 4px var(--blue-glow); }
  .type-input.correct { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
  .type-input.wrong { background: var(--red-light); border-color: var(--red); color: var(--red-dark); }

  /* Match */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .match-item {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 14px; padding: 0.8rem;
    cursor: pointer; font-weight: 700; font-size: 0.95rem;
    text-align: center; box-shadow: 0 3px 0 var(--gray);
    transition: all 0.15s; color: var(--text);
  }
  .match-item:hover:not(.matched) { border-color: var(--blue); }
  .match-item.selected {
    border-color: var(--purple);
    background: var(--blue-light);
    color: var(--purple);
  }
  .match-item.matched {
    background: var(--green-light); border-color: var(--green);
    color: var(--green-dark); opacity: 0.5;
    pointer-events: none; transform: scale(0.95);
  }

  /* =================== FOOTER LIÇÃO =================== */
  .lesson-footer {
    border-top: 2px solid var(--gray);
    padding: 1rem 1.2rem; background: var(--bg);
    position: sticky; bottom: 0;
    backdrop-filter: blur(10px);
  }
  .lesson-footer-inner {
    max-width: 600px; margin: 0 auto;
    display: flex; gap: 1rem; align-items: center;
    justify-content: space-between;
  }
  .feedback-box {
    flex: 1; display: none; align-items: center; gap: 0.7rem;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback-box.correct { color: var(--green-dark); }
  .feedback-box.wrong { color: var(--red-dark); }
  .feedback-icon { font-size: 1.8rem; flex-shrink: 0; }
  .feedback-text { font-weight: 900; font-size: 1rem; }
  .feedback-sub { font-size: 0.82rem; opacity: 0.85; font-weight: 600; }

  .btn {
    border: none; border-radius: 16px;
    padding: 0.95rem 1.6rem;
    font-size: 0.95rem; font-weight: 900;
    letter-spacing: 0.5px; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
    color: white; min-width: 130px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    box-shadow: 0 4px 0 var(--blue-dark), 0 6px 15px var(--blue-glow);
  }
  .btn-primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
  .btn-primary:disabled {
    background: var(--gray); box-shadow: 0 4px 0 var(--gray-mid);
    color: var(--gray-dark); cursor: not-allowed;
  }
  .btn-danger {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    box-shadow: 0 4px 0 var(--red-dark), 0 6px 15px rgba(239,68,68,0.35);
  }
  .btn-danger:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-dark); }
  .btn-secondary {
    background: var(--bg); color: var(--gray-dark);
    border: 2px solid var(--gray); box-shadow: 0 4px 0 var(--gray);
  }
  .btn-secondary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gray); }

  /* =================== MODAIS =================== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,37,64,0.65);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 1rem;
    animation: fadeIn 0.25s;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.active { display: flex; }

   ================================================================ */
function salvar() { localStorage.setItem('lingualearn_blue_v1', JSON.stringify(state.usuario)); }

function carregar() {
  const raw = localStorage.getItem('lingualearn_blue_v1');
  if (raw) {
    try {
      const u = JSON.parse(raw);
      state.usuario = { ...state.usuario, ...u };
      const hoje = new Date().toDateString();
      const ontem = new Date(Date.now() - 86400000).toDateString();
      if (state.usuario.lastPlayed && state.usuario.lastPlayed !== hoje && state.usuario.lastPlayed !== ontem) {
        state.usuario.streak = 0;
      }
    } catch(e) {}
  }
  atualizarTopbar();
}

function atualizarTopbar() {
  document.getElementById('streakVal').textContent = state.usuario.streak;
  document.getElementById('heartsVal').textContent = state.usuario.hearts;
  document.getElementById('gemsVal').textContent = state.usuario.gems;
}

   ================================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const backBtn = document.getElementById('backBtn');
  const bottomNav = document.getElementById('bottomNav');

  if (id === 'homeScreen') {
    backBtn.classList.remove('visible');
    bottomNav.classList.remove('visible');
  } else if (id === 'trailScreen') {
    backBtn.classList.add('visible');
    bottomNav.classList.remove('visible');
  } else if (id === 'lessonScreen') {
    backBtn.classList.remove('visible');
    bottomNav.classList.remove('visible');
  } else {
    backBtn.classList.remove('visible');
    bottomNav.classList.add('visible');
  }
  atualizarNavAtivo(id);
}

function atualizarNavAtivo(screenId) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (screenId === 'homeScreen') document.getElementById('navHome').classList.add('active');
  if (screenId === 'profileScreen') document.getElementById('navProfile').classList.add('active');
  if (screenId === 'leagueScreen') document.getElementById('navLeague').classList.add('active');
}

  }).join('');
}

/* ================================================================
   TRILHA
   ================================================================ */
function abrirIdioma(key) {
  state.idiomaAtual = key;
  state.telaAtual = 'trail';
  renderTrail();
  showScreen('trailScreen');
}

function renderTrail() {
  const lang = IDIOMAS[state.idiomaAtual];
  const prog = state.usuario.progresso[state.idiomaAtual] || [];
  const completed = prog.filter(Boolean).length;
  const pct = Math.round((completed / LESSONS_PER_LANG) * 100);

  document.getElementById('trailHeader').innerHTML = `
    <h2>${lang.flag} Curso de ${lang.nome}</h2>
    <p>${completed === LESSONS_PER_LANG ? '👑 Curso completo! Você é incrível!' : `Continue de onde parou`}</p>
    <div class="stats-row">
      <div><strong>${completed}</strong><span>Lições</span></div>
      <div><strong>${pct}%</strong><span>Progresso</span></div>
      <div><strong>${lang.frases.length}</strong><span>Frases</span></div>
    </div>
  `;

  const trail = document.getElementById('trail');
  let html = '';
  for (let i = 0; i < LESSONS_PER_LANG; i++) {
    const isCompleted = prog[i] === true;
    const unlocked = i === 0 || prog[i-1] === true;
    const offset = i % 3 === 0 ? '' : (i % 3 === 1 ? 'node-offset-1' : 'node-offset-2');
    const cls = isCompleted ? 'completed' : (unlocked ? 'unlocked' : 'locked');
    const icon = isCompleted ? '👑' : (unlocked ? (i+1) : '🔒');
    html += `
      <button class="lesson-node ${cls} ${offset}" onclick="iniciarLicao(${i})" ${!unlocked ? 'disabled' : ''}>
        ${icon}
        <span class="node-label">Lição ${i+1}</span>
        ${unlocked && !isCompleted ? `<span class="node-xp-badge">+${XP_PER_LESSON}</span>` : ''}
      </button>
    `;
  }
  trail.innerHTML = html;
}

/* ================================================================
   SRS
   ================================================================ */
function getSRSKey(idiomaKey, frase) { return `${idiomaKey}::${frase.en}`; }

function getFrasesPrioritarias(idiomaKey) {
  const todas = IDIOMAS[idiomaKey].frases;
  const agora = Date.now();
  const devidas = [], novas = [], futuras = [];

  todas.forEach(f => {
    const key = getSRSKey(idiomaKey, f);
    const srs = state.usuario.srs[key];
    if (!srs) novas.push(f);
    else if (srs.nextReview <= agora) devidas.push(f);
    else futuras.push(f);
  });

  return [...shuffle(devidas), ...shuffle(novas), ...shuffle(futuras)];
}

function atualizarSRS(idiomaKey, frase, acertou) {
  const key = getSRSKey(idiomaKey, frase);
  const atual = state.usuario.srs[key] || { level: 0, nextReview: 0 };
  let novoLevel = atual.level;

  if (acertou) {
    novoLevel = Math.min(atual.level + 1, 6);
    state.usuario.srsStats.correct++;
  } else {
    novoLevel = Math.max(0, atual.level - 1);
    state.usuario.srsStats.wrong++;
  }

  const intervalos = [0, 1, 4, 12, 24, 72, 168];
  const horas = intervalos[novoLevel] || 24;
  state.usuario.srs[key] = { level: novoLevel, nextReview: Date.now() + horas * 3600 * 1000 };
}

/* ================================================================
   MOTOR DE EXERCÍCIOS
   ================================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gerarExercicios(idiomaKey) {
  const frases = getFrasesPrioritarias(idiomaKey).slice(0, EXERCISES_PER_LESSON);
  const todas = IDIOMAS[idiomaKey].frases;

  return frases.map((frase, idx) => {
    const tipos = ['multipla_pt2lang', 'banco', 'ouvir', 'multipla_lang2pt', 'digitar'];
    const tipo = tipos[idx % tipos.length];

    if (tipo === 'multipla_pt2lang') {
      const distratores = shuffle(todas.filter(f => f.en !== frase.en)).slice(0, 3).map(f => f.en);
      return {
        tipo: 'multipla', pergunta: frase.pt,
        perguntaLabel: 'Como se diz em ' + IDIOMAS[idiomaKey].nome + '?',
        correta: frase.en, opcoes: shuffle([frase.en, ...distratores]), frase
      };
    }
    if (tipo === 'multipla_lang2pt') {
      const distratores = shuffle(todas.filter(f => f.pt !== frase.pt)).slice(0, 3).map(f => f.pt);
      return {
        tipo: 'multipla', pergunta: frase.en,
        perguntaLabel: 'O que significa?',
        correta: frase.pt, opcoes: shuffle([frase.pt, ...distratores]), frase
      };
    }
    if (tipo === 'banco') {
      const palavrasCorretas = frase.en.split(/\s+/);
      const extras = [];
      shuffle(todas).forEach(f => {
        if (extras.length >= 3) return;
        const ws = f.en.split(/\s+/).filter(w => !palavrasCorretas.includes(w));
        ws.forEach(w => { if (extras.length < 3 && !extras.includes(w)) extras.push(w); });
      });
      return {
        tipo: 'banco', pergunta: frase.pt,
        perguntaLabel: 'Traduza para ' + IDIOMAS[idiomaKey].nome,
        correta: frase.en, banco: shuffle([...palavrasCorretas, ...extras]), frase
      };
    }
    if (tipo === 'ouvir') {
      const distratores = shuffle(todas.filter(f => f.pt !== frase.pt)).slice(0, 3).map(f => f.pt);
      return {
        tipo: 'ouvir', pergunta: frase.en,
        perguntaLabel: 'O que você ouviu?',
        correta: frase.pt, opcoes: shuffle([frase.pt, ...distratores]), frase
      };
    }
    return {
      tipo: 'digitar', pergunta: frase.pt,
      perguntaLabel: 'Digite em ' + IDIOMAS[idiomaKey].nome,
      correta: frase.en, frase
    };
  });
}

/* ================================================================
   LIÇÃO
   ================================================================ */
function iniciarLicao(idx) {
  if (state.usuario.hearts <= 0) { mostrarGameOver(); return; }

  const exercicios = gerarExercicios(state.idiomaAtual);
  state.licaoAtual = {
    exercicios, indice: 0, acertos: 0, total: exercicios.length,
    lessonIdx: idx, combo: 0, maxComboInLesson: 0, erros: 0
  };

  state.telaAtual = 'lesson';
  showScreen('lessonScreen');
  renderExercicio();
}

function renderExercicio() {
  const { exercicios, indice } = state.licaoAtual;
  if (indice >= exercicios.length) return finalizarLicao();

  const ex = exercicios[indice];
  const content = document.getElementById('lessonContent');
  const feedbackBox = document.getElementById('feedbackBox');
  const checkBtn = document.getElementById('checkBtn');
  feedbackBox.style.display = 'none';
  feedbackBox.className = 'feedback-box';
  checkBtn.textContent = 'Verificar';
  checkBtn.className = 'btn btn-primary';
  checkBtn.disabled = true;
  checkBtn.onclick = checkAnswer;

  const pct = (indice / exercicios.length) * 100;
  document.getElementById('lessonProgress').style.width = pct + '%';

  const comboHtml = state.licaoAtual.combo >= 3
    ? `<span class="combo-badge">🔥 ${state.licaoAtual.combo}x</span>`
    : '';

  let html = `
    <div class="lesson-sub">
      <span>L ${state.licaoAtual.lessonIdx + 1} · ${indice + 1}/${exercicios.length}</span>
      ${comboHtml}
    </div>
    <div class="exercise-prompt">
      <span class="icon">${ex.tipo === 'ouvir' ? '🎧' : ex.tipo === 'digitar' ? '⌨️' : ex.tipo === 'banco' ? '🧩' : '💭'}</span>
      <span>${ex.perguntaLabel}</span>
    </div>
  `;

  if (ex.tipo === 'multipla') {
    html += `<h2 style="font-size:1.5rem; margin:1rem 0 1.3rem; color:var(--text); font-weight:900;">"${ex.pergunta}"</h2>`;
    html += `<div class="options">`;
    ex.opcoes.forEach((op, i) => {
      const letra = String.fromCharCode(65 + i);
      html += `<button class="option" data-value="${op.replace(/"/g, '&quot;')}" onclick="selecionarOpcao(this, '${op.replace(/'/g, "\\'")}')">
        <span class="num">${letra}</span><span>${op}</span>
      </button>`;
    });
    html += `</div>`;
  } else if (ex.tipo === 'ouvir') {
    html += `<button class="audio-btn-big" id="audioBtn" onclick="reproduzirAudio()">🔊</button>`;
    html += `<p style="text-align:center; color:var(--text-light); font-size:0.9rem; margin-bottom:1.2rem; font-weight:600;">Toque para ouvir novamente</p>`;
    html += `<div class="options">`;
    ex.opcoes.forEach((op, i) => {
      const letra = String.fromCharCode(65 + i);
      html += `<button class="option" data-value="${op.replace(/"/g, '&quot;')}" onclick="selecionarOpcao(this, '${op.replace(/'/g, "\\'")}')">
        <span class="num">${letra}</span><span>${op}</span>
      </button>`;
    });
    html += `</div>`;
  } else if (ex.tipo === 'banco') {
    html += `<h2 style="font-size:1.4rem; margin:1rem 0 1.3rem; color:var(--text); font-weight:900;">"${ex.pergunta}"</h2>`;
    html += `<div class="word-bank-area" id="wordBankArea"></div>`;
    html += `<div class="word-bank" id="wordBank">`;
    ex.banco.forEach((p, i) => {
      html += `<button class="word-chip" data-word="${p.replace(/"/g, '&quot;')}" data-idx="${i}" onclick="usarPalavra(this)">${p}</button>`;
    });
    html += `</div>`;
  } else if (ex.tipo === 'digitar') {
    html += `<h2 style="font-size:1.4rem; margin:1rem 0 1.3rem; color:var(--text); font-weight:900;">"${ex.pergunta}"</h2>`;
    html += `<input type="text" class="type-input" id="typeInput" placeholder="Digite a tradução..." autocomplete="off" autocapitalize="off" spellcheck="false" oninput="onTypeInput()">`;
  }

  content.innerHTML = html;

  if (ex.tipo === 'ouvir') setTimeout(() => reproduzirAudio(), 400);
  if (ex.tipo === 'digitar') setTimeout(() => document.getElementById('typeInput').focus(), 200);
}

function reproduzirAudio() {
  const { exercicios, indice } = state.licaoAtual;
  const ex = exercicios[indice];
  const btn = document.getElementById('audioBtn');
  if (btn) {
    btn.classList.add('playing');
    setTimeout(() => btn.classList.remove('playing'), 1200);
  }
  falar(ex.pergunta);
}

let respostaSelecionada = null;
let palavrasUsadas = [];

function selecionarOpcao(btn, valor) {
  if (btn.disabled || document.getElementById('checkBtn').textContent === 'Continuar') return;
  document.querySelectorAll('.option').forEach(o => {
    o.style.borderColor = '';
    o.style.background = '';
  });
  btn.style.borderColor = 'var(--blue)';
  btn.style.background = 'var(--blue-lighter)';
  respostaSelecionada = valor;
  document.getElementById('checkBtn').disabled = false;
}

function usarPalavra(btn) {
  if (btn.classList.contains('used')) return;
  btn.classList.add('used');
  palavrasUsadas.push({ word: btn.dataset.word, idx: btn.dataset.idx });
  renderWordBankArea();
  document.getElementById('checkBtn').disabled = palavrasUsadas.length === 0;
}

function removerPalavra(idx) {
  palavrasUsadas = palavrasUsadas.filter(p => p.idx !== idx);
  document.querySelectorAll('.word-chip').forEach(c => {
    if (c.dataset.idx === String(idx)) c.classList.remove('used');
  });
  renderWordBankArea();
  document.getElementById('checkBtn').disabled = palavrasUsadas.length === 0;
}

function renderWordBankArea() {
  const area = document.getElementById('wordBankArea');
  if (!area) return;
  area.innerHTML = palavrasUsadas.map(p =>
    `<button class="word-chip placed" onclick="removerPalavra('${p.idx}')">${p.word}</button>`
  ).join('');
}

function onTypeInput() {
  const inp = document.getElementById('typeInput');
  document.getElementById('checkBtn').disabled = inp.value.trim().length === 0;
}

/* ================================================================
   VERIFICAR RESPOSTA
   ================================================================ */
function checkAnswer() {
  const { exercicios, indice } = state.licaoAtual;
  const ex = exercicios[indice];
  let resposta = '';
  let correta = false;

  if (ex.tipo === 'multipla' || ex.tipo === 'ouvir') {
    resposta = respostaSelecionada || '';
    correta = resposta === ex.correta;
    document.querySelectorAll('.option').forEach(btn => {
      btn.disabled = true;
      const val = btn.dataset.value;
      if (val === ex.correta) btn.classList.add('correct');
      else if (respostaSelecionada === val && val !== ex.correta) btn.classList.add('wrong');
      btn.style.borderColor = '';
      btn.style.background = '';
    });
  } else if (ex.tipo === 'banco') {
    resposta = palavrasUsadas.map(p => p.word).join(' ');
    correta = normalizar(resposta) === normalizar(ex.correta);
    document.querySelectorAll('.word-chip').forEach(c => c.disabled = true);
  } else if (ex.tipo === 'digitar') {
    const inp = document.getElementById('typeInput');
    resposta = inp.value.trim();
    correta = normalizar(resposta) === normalizar(ex.correta);
    inp.classList.add(correta ? 'correct' : 'wrong');
    inp.disabled = true;
  }

  atualizarSRS(state.idiomaAtual, ex.frase, correta);

  const fb = document.getElementById('feedbackBox');
  const icon = document.getElementById('feedbackIcon');
  const text = document.getElementById('feedbackText');
  const sub = document.getElementById('feedbackSub');
  fb.style.display = 'flex';

  if (correta) {
    state.licaoAtual.acertos++;
    state.licaoAtual.combo++;
    if (state.licaoAtual.combo > state.licaoAtual.maxComboInLesson) {
      state.licaoAtual.maxComboInLesson = state.licaoAtual.combo;
    }
    if (state.licaoAtual.combo > state.usuario.maxCombo) {
      state.usuario.maxCombo = state.licaoAtual.combo;
    }
    fb.classList.add('correct');
    icon.textContent = '✅';
    text.textContent = 'Muito bem!';
    const frases = ['Boa!', 'Continue assim!', 'Excelente!', 'Você consegue!', 'Arrasou!', 'Perfeito!'];
    sub.textContent = state.licaoAtual.combo >= 3
      ? `🔥 Combo x${state.licaoAtual.combo}! ${shuffle(frases)[0]}`
      : shuffle(frases)[0];
    tocarSom('correct');
    burstStars();
  } else {
    state.licaoAtual.erros++;
    state.licaoAtual.combo = 0;
    state.usuario.hearts = Math.max(0, state.usuario.hearts - 1);
    atualizarTopbar(); salvar();
    fb.classList.add('wrong');
    icon.textContent = '❌';
    text.textContent = 'Resposta correta:';
    sub.textContent = ex.correta;
    tocarSom('wrong');
    document.querySelector('.lesson-content').classList.add('shake');
    setTimeout(() => document.querySelector('.lesson-content').classList.remove('shake'), 500);
  }

  const btn = document.getElementById('checkBtn');
  btn.textContent = 'Continuar';
  btn.className = correta ? 'btn btn-primary' : 'btn btn-danger';
  btn.disabled = false;
  btn.onclick = proximoExercicio;

  if (state.usuario.hearts <= 0) setTimeout(() => mostrarGameOver(), 1500);
}

function normalizar(s) {
  return s.toLowerCase()
    .replace(/[¿?¡!.,;:]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function proximoExercicio() {
  state.licaoAtual.indice++;
  respostaSelecionada = null;
  palavrasUsadas = [];
  renderExercicio();
}

/* ================================================================
   FINALIZAR LIÇÃO
   ================================================================ */
function finalizarLicao() {
  const { acertos, total, lessonIdx, maxComboInLesson } = state.licaoAtual;
  const xpBase = acertos * 5;
  const bonusCombo = maxComboInLesson >= 5 ? 10 : 0;
  const bonusPerfeito = acertos === total ? 15 : 0;
  const xpGanho = xpBase + bonusCombo + bonusPerfeito;
  const precisao = Math.round((acertos / total) * 100);

  state.usuario.xp += xpGanho;
  state.usuario.gems += Math.floor(xpGanho / 10);

  if (precisao === 100) state.usuario.perfectLessons++;

  const hora = new Date().getHours();
  if (hora >= 22 || hora < 5) state.usuario.nightOwl = true;

  if (!state.usuario.progresso[state.idiomaAtual]) state.usuario.progresso[state.idiomaAtual] = [];
  if (precisao >= 60) state.usuario.progresso[state.idiomaAtual][lessonIdx] = true;

  const hoje = new Date().toDateString();
  const ontem = new Date(Date.now() - 86400000).toDateString();
  if (state.usuario.lastPlayed !== hoje) {
    if (state.usuario.lastPlayed === ontem) state.usuario.streak++;
    else state.usuario.streak = 1;
    state.usuario.lastPlayed = hoje;
  }

  const novasConquistas = [];
  CONQUISTAS.forEach(c => {
    if (!state.usuario.conquistas.includes(c.id) && c.check(state.usuario)) {
      state.usuario.conquistas.push(c.id);
      novasConquistas.push(c);
    }
  });

  atualizarTopbar();
  salvar();

  document.getElementById('resultXP').textContent = '+' + xpGanho;
  document.getElementById('resultAcc').textContent = precisao + '%';
  document.getElementById('resultCombo').textContent = 'x' + maxComboInLesson;

  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');

  if (precisao === 100) {
    icon.textContent = '🏆';
    title.textContent = 'PERFEITO!';
    sub.textContent = 'Você acertou tudo! Incrível!';
  } else if (precisao >= 80) {
    icon.textContent = '🌟';
    title.textContent = 'Excelente!';
    sub.textContent = 'Você está indo muito bem!';
  } else if (precisao >= 60) {
    icon.textContent = '🎉';
    title.textContent = 'Lição Completa!';
    sub.textContent = 'Bom trabalho!';
  } else {
    icon.textContent = '💪';
    title.textContent = 'Continue tentando!';
    sub.textContent = 'Você vai conseguir!';
  }

  const achList = document.getElementById('achievementsUnlocked');
  if (novasConquistas.length > 0) {
    achList.innerHTML = novasConquistas.map(c => `
      <div class="achievement-toast">
        <span class="emoji">${c.emoji}</span>
        <div class="info">
          <strong>🏅 Nova conquista!</strong>
          <span>${c.nome} — ${c.desc}</span>
        </div>
      </div>
    `).join('');
  } else {
    achList.innerHTML = '';
  }

  document.getElementById('resultModal').classList.add('active');

  if (precisao >= 60) {
    soltarConfetes(80);
    tocarSom('complete');
  }
}

function closeResult() {
  document.getElementById('resultModal').classList.remove('active');
  state.telaAtual = 'trail';
  renderTrail();
  showScreen('trailScreen');
}

/* ================================================================
   GAME OVER
   ================================================================ */
function mostrarGameOver() {
  const modal = document.getElementById('resultModal');
  document.getElementById('resultIcon').textContent = '💔';
  document.getElementById('resultTitle').textContent = 'Sem corações!';
  document.getElementById('resultSub').textContent = 'Recupere para continuar aprendendo.';
  document.getElementById('resultXP').textContent = '—';
  document.getElementById('resultAcc').textContent = '—';
  document.getElementById('resultCombo').textContent = '—';
  document.getElementById('achievementsUnlocked').innerHTML = '';

  const btnContinuar = modal.querySelector('.btn');
  btnContinuar.textContent = 'Voltar';

  if (!document.getElementById('restoreBtn')) {
    const b = document.createElement('button');
    b.id = 'restoreBtn';
    b.className = 'btn btn-secondary';
    b.style.marginTop = '0.6rem';
    b.textContent = '💎 Usar 10 gemas';
    b.onclick = () => {
      if (state.usuario.gems < 10) {
        alert('Você precisa de 10 gemas! 💎');
        return;
      }
      state.usuario.gems -= 10;
      state.usuario.hearts = 5;
      atualizarTopbar(); salvar();
      modal.classList.remove('active');
      closeResult();
    };
    modal.appendChild(b);
  }
  modal.classList.add('active');
}

/* ================================================================
   ÁUDIO
   ================================================================ */
function falar(texto) {
  if (!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = IDIOMAS[state.idiomaAtual]?.code || 'en-US';
  utter.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

let audioCtx = null;
function tocarSom(tipo) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = {
      correct: [523.25, 659.25, 783.99],
      wrong: [392, 311.13],
      complete: [523.25, 659.25, 783.99, 1046.5]
    }[tipo] || [440];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.09 + 0.22);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * 0.09);
      osc.stop(audioCtx.currentTime + i * 0.09 + 0.28);
    });
  } catch(e) {}
}

function burstStars() {
  const colors = ['⭐', '✨', '🌟', '💫'];
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('div');
    s.className = 'star-burst';
    s.textContent = colors[Math.floor(Math.random() * colors.length)];
    const rect = document.getElementById('checkBtn').getBoundingClientRect();
    s.style.left = rect.left + 'px';
    s.style.top = rect.top + 'px';
    s.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
    s.style.setProperty('--ty', (-Math.random() * 150 - 50) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function soltarConfetes(qtd = 50) {
  const colors = ['#1cb0f6', '#00c2ff', '#7b6ef6', '#fbbf24', '#22c55e', '#00d4c8'];
  for (let i = 0; i < qtd; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.6 + 's';
    c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    c.style.width = (6 + Math.random() * 10) + 'px';
    c.style.height = c.style.width;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

      <div class="avatar-mini">${p.avatar}</div>
      <div class="name">${p.nome}</div>
      <div class="xp">⚡ ${p.xp}</div>
    </div>
  `).join('');
}

/* ================================================================
   TEMA
   ================================================================ */
function toggleTheme() {
  const atual = document.body.dataset.theme;
  const novo = atual === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = novo;
  document.getElementById('themeBtn').textContent = novo === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('lingualearn_blue_theme', novo);
}

function carregarTema() {
  const salvo = localStorage.getItem('lingualearn_blue_theme');
  if (salvo) {
    document.body.dataset.theme = salvo;
    document.getElementById('themeBtn').textContent = salvo === 'dark' ? '☀️' : '🌙';
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.body.dataset.theme = 'dark';
    document.getElementById('themeBtn').textContent = '☀️';
  }
}

/* ================================================================
   INIT
   ================================================================ */
carregarTema();
carregar();
renderHome();

// PWA - Service Worker
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const swCode = `
    const CACHE = 'lingualearn-blue-v1';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
          const copy = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, copy));
          return resp;
        }).catch(() => caches.match('./')))
      );
    });
  `;
  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  } catch(e) {}
}
</script>
