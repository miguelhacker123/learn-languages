<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LinguaLearn 🦉</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22LinguaLearn%22,%22short_name%22:%22LinguaLearn%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%2358cc02%22,%22theme_color%22:%22%2358cc02%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%2780%27%20font-size%3D%2780%27%3E%F0%9F%A6%89%3C%2Ftext%3E%3C%2Fsvg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --green: #58cc02; --green-dark: #46a302; --green-light: #d7ffb8;
    --blue: #1cb0f6; --blue-dark: #1899d6;
    --red: #ff4b4b; --red-dark: #ea2b2b; --red-light: #ffdfe0;
    --yellow: #ffc800; --yellow-dark: #e5b300; --yellow-light: #fff4cc;
    --purple: #ce82ff; --purple-dark: #a568cc;
    --orange: #ff9600;
    --gray: #e5e5e5; --gray-mid: #afafaf; --gray-dark: #777;
    --text: #3c3c3c; --text-light: #777;
    --bg: #fff; --bg-alt: #f7f7f7;
    --shadow: rgba(0,0,0,0.08);
  }

  [data-theme="dark"] {
    --text: #f1f1f1; --text-light: #a0a0a0;
    --bg: #131f24; --bg-alt: #1c2b33;
    --gray: #37464f; --gray-mid: #52656d; --gray-dark: #8a9ba3;
    --shadow: rgba(0,0,0,0.4);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* =================== TOPBAR =================== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 2px solid var(--gray);
    padding: 0.7rem 1rem;
    display: flex; justify-content: space-between; align-items: center;
    gap: 0.8rem;
  }
  .topbar-left { display: flex; align-items: center; gap: 0.7rem; }
  .back-btn {
    background: none; border: none;
    font-size: 1.4rem; cursor: pointer;
    color: var(--gray-dark); padding: 0.3rem 0.5rem;
    display: none; border-radius: 8px;
  }
  .back-btn.visible { display: block; }
  .back-btn:hover { background: var(--bg-alt); }

  .logo-mini {
    display: flex; align-items: center; gap: 0.4rem;
    font-weight: 800; font-size: 1.1rem;
    background: linear-gradient(135deg, var(--green), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    cursor: pointer;
  }

  .topbar-right { display: flex; gap: 0.8rem; align-items: center; }
  .stat {
    display: flex; align-items: center; gap: 0.25rem;
    font-weight: 800; font-size: 0.95rem;
    padding: 0.3rem 0.5rem; border-radius: 10px;
  }
  .stat.hearts { color: var(--red); }
  .stat.streak { color: var(--orange); }
  .stat.gems { color: var(--blue); }
  .stat.xp { color: var(--yellow); }
  .icon-btn {
    background: none; border: none;
    font-size: 1.3rem; cursor: pointer;
    padding: 0.3rem; border-radius: 8px;
  }
  .icon-btn:hover { background: var(--bg-alt); }

  /* =================== SCREENS =================== */
  .screen { display: none; padding: 1.5rem 1rem; max-width: 640px; margin: 0 auto; }
  .screen.active { display: block; animation: fadeIn 0.35s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* =================== MASCOTE =================== */
  .mascot-container {
    width: 130px; height: 130px;
    margin: 0 auto 1rem;
    animation: bounce 2.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 15px rgba(88,204,2,0.35));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }
  .mascot-container svg { width: 100%; height: 100%; }

  /* =================== HOME =================== */
  .hero { text-align: center; padding: 1.5rem 0.5rem 2rem; }
  .hero h1 {
    font-size: 2rem; margin-bottom: 0.4rem; font-weight: 800;
    background: linear-gradient(135deg, var(--green), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p { color: var(--text-light); font-size: 1rem; margin-bottom: 1.5rem; }

  .lang-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.9rem;
  }
  .lang-btn {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 18px; padding: 1.3rem 0.8rem;
    cursor: pointer; text-align: center;
    transition: all 0.15s; box-shadow: 0 4px 0 var(--gray);
    position: relative; color: var(--text);
  }
  .lang-btn:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 4px 0 var(--blue); }
  .lang-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--gray); }
  .lang-btn .flag { font-size: 2.6rem; display: block; margin-bottom: 0.4rem; }
  .lang-btn .name { font-weight: 800; font-size: 1.05rem; }
  .lang-btn .progress-mini {
    font-size: 0.72rem; color: var(--text-light);
    margin-top: 0.4rem; font-weight: 600;
  }
  .lang-btn .crown-badge {
    position: absolute; top: -8px; right: -8px;
    background: var(--yellow); color: #7a5c00;
    font-size: 0.75rem; font-weight: 800;
    padding: 0.2rem 0.5rem; border-radius: 20px;
    border: 2px solid var(--bg);
  }

  /* =================== TRILHA =================== */
  .trail-header {
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: white; border-radius: 20px;
    padding: 1.5rem; margin-bottom: 1.5rem;
    box-shadow: 0 8px 20px rgba(88,204,2,0.3);
  }
  .trail-header h2 { font-size: 1.4rem; margin-bottom: 0.4rem; }
  .trail-header p { opacity: 0.9; font-size: 0.9rem; }
  .trail-header .stats-row {
    display: flex; gap: 1rem; margin-top: 1rem;
    padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.2);
  }
  .trail-header .stats-row div { flex: 1; text-align: center; }
  .trail-header .stats-row strong { display: block; font-size: 1.2rem; }
  .trail-header .stats-row span { font-size: 0.75rem; opacity: 0.85; }

  .trail { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; padding: 1rem 0 4rem; }
  .lesson-node {
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--gray); border: none;
    color: white; font-size: 1.6rem; font-weight: 800;
    cursor: pointer; box-shadow: 0 6px 0 var(--gray-mid);
    transition: all 0.15s; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .lesson-node.unlocked { background: var(--green); box-shadow: 0 6px 0 var(--green-dark); }
  .lesson-node.unlocked:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .lesson-node.unlocked:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-dark); }
  .lesson-node.completed { background: var(--yellow); box-shadow: 0 6px 0 var(--yellow-dark); color: #7a5c00; }
  .lesson-node.locked { cursor: not-allowed; opacity: 0.55; }
  .node-offset-1 { transform: translateX(-40px); }
  .node-offset-2 { transform: translateX(40px); }
  .node-label {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%); margin-top: 0.3rem;
    font-size: 0.68rem; color: var(--text-light);
    font-weight: 800; white-space: nowrap;
  }
  .node-xp-badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--purple); color: white;
    font-size: 0.65rem; font-weight: 800;
    padding: 0.15rem 0.4rem; border-radius: 20px;
    border: 2px solid var(--bg);
  }

  /* =================== LIÇÃO =================== */
  .lesson-screen {
    padding: 0 !important; max-width: 100% !important;
    display: none; flex-direction: column; min-height: 100vh;
    background: var(--bg);
  }
  .lesson-screen.active { display: flex; }
  .lesson-progress-bar {
    height: 14px; background: var(--gray);
    border-radius: 10px; margin: 1rem 1rem 0;
    overflow: hidden;
  }
  .lesson-progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--green), #7fe02f);
    border-radius: 10px; transition: width 0.4s ease;
  }
  .lesson-content {
    flex: 1; padding: 1.5rem 1.2rem;
    max-width: 600px; margin: 0 auto; width: 100%;
  }
  .lesson-sub {
    color: var(--text-light); font-size: 0.85rem;
    margin-bottom: 1rem; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .lesson-sub .combo-badge {
    background: linear-gradient(135deg, var(--orange), var(--red));
    color: white; padding: 0.15rem 0.5rem; border-radius: 20px;
    font-size: 0.75rem; font-weight: 800;
    animation: pulse 0.5s;
  }
  @keyframes pulse {
    0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); }
  }

  .exercise-prompt {
    font-size: 1.15rem; font-weight: 800;
    margin-bottom: 1.2rem; color: var(--text);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .exercise-prompt .icon { font-size: 1.4rem; }

  .audio-btn-big {
    background: var(--blue); color: white; border: none;
    width: 100px; height: 100px; border-radius: 22px;
    font-size: 2.4rem; cursor: pointer;
    box-shadow: 0 5px 0 var(--blue-dark);
    transition: all 0.15s; display: block; margin: 0 auto 1rem;
  }
  .audio-btn-big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-dark); }
  .audio-btn-big.playing { animation: pulse-audio 0.6s infinite; }
  @keyframes pulse-audio {
    0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); }
  }

  .options { display: grid; gap: 0.8rem; }
  .option {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 14px; padding: 1rem 1.1rem;
    cursor: pointer; text-align: left;
    font-size: 1rem; font-weight: 600;
    color: var(--text); box-shadow: 0 4px 0 var(--gray);
    transition: all 0.15s; display: flex; align-items: center; gap: 0.7rem;
  }
  .option .num {
    background: var(--bg-alt); border: 2px solid var(--gray);
    border-radius: 8px; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 800;
    color: var(--gray-dark); flex-shrink: 0;
  }
  .option:hover:not(:disabled) { border-color: var(--blue); background: var(--bg-alt); }
  .option:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--gray); }
  .option.correct { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
  .option.correct .num { border-color: var(--green); color: var(--green-dark); }
  .option.wrong { background: var(--red-light); border-color: var(--red); color: var(--red-dark); }
  .option.wrong .num { border-color: var(--red); color: var(--red-dark); }
  .option:disabled { cursor: default; }

  /* Word bank */
  .word-bank-area {
    min-height: 66px; border-bottom: 2px solid var(--gray);
    border-top: 2px solid var(--gray); padding: 0.8rem 0;
    margin-bottom: 1.2rem; display: flex; flex-wrap: wrap;
    gap: 0.5rem; align-content: flex-start;
  }
  .word-bank { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .word-chip {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 12px; padding: 0.55rem 0.9rem;
    font-size: 0.95rem; font-weight: 600;
    cursor: pointer; box-shadow: 0 3px 0 var(--gray);
    color: var(--text); transition: all 0.15s;
  }
  .word-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gray); }
  .word-chip.used { opacity: 0.25; pointer-events: none; }
  .word-chip.placed { background: #e6f4ff; border-color: var(--blue); color: var(--blue-dark); box-shadow: 0 3px 0 var(--blue); }
  [data-theme="dark"] .word-chip.placed { background: #143a4d; }

  /* Input (digitar) */
  .type-input {
    width: 100%; padding: 1rem;
    border: 2px solid var(--gray); border-radius: 14px;
    font-size: 1rem; font-weight: 600;
    background: var(--bg); color: var(--text);
    box-shadow: 0 4px 0 var(--gray);
    outline: none;
  }
  .type-input:focus { border-color: var(--blue); }
  .type-input.correct { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
  .type-input.wrong { background: var(--red-light); border-color: var(--red); color: var(--red-dark); }

  /* Match (associar pares) */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .match-item {
    background: var(--bg); border: 2px solid var(--gray);
    border-radius: 12px; padding: 0.8rem;
    cursor: pointer; font-weight: 600; font-size: 0.95rem;
    text-align: center; box-shadow: 0 3px 0 var(--gray);
    transition: all 0.15s; color: var(--text);
  }
  .match-item:hover:not(.matched) { border-color: var(--blue); }
  .match-item.selected { border-color: var(--purple); background: #f3e8ff; color: var(--purple-dark); }
  [data-theme="dark"] .match-item.selected { background: #2d1b47; }
  .match-item.matched {
    background: var(--green-light); border-color: var(--green);
    color: var(--green-dark); opacity: 0.5;
    pointer-events: none; transform: scale(0.95);
  }

  /* =================== FOOTER LIÇÃO =================== */
  .lesson-footer {
    border-top: 2px solid var(--gray);
    padding: 1rem 1.2rem; background: var(--bg);
    position: sticky; bottom: 0;
  }
  .lesson-footer-inner {
    max-width: 600px; margin: 0 auto;
    display: flex; gap: 1rem; align-items: center;
    justify-content: space-between;
  }
  .feedback-box {
    flex: 1; display: none; align-items: center; gap: 0.7rem;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback-box.correct { color: var(--green-dark); }
  .feedback-box.wrong { color: var(--red-dark); }
  .feedback-icon { font-size: 1.8rem; flex-shrink: 0; }
  .feedback-text { font-weight: 800; font-size: 1rem; }
  .feedback-sub { font-size: 0.82rem; opacity: 0.85; font-weight: 600; }

  .btn {
    border: none; border-radius: 14px;
    padding: 0.9rem 1.6rem;
    font-size: 0.95rem; font-weight: 800;
    letter-spacing: 0.5px; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
    color: white; min-width: 130px;
  }
  .btn-primary { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-dark); }
  .btn-primary:disabled { background: var(--gray); box-shadow: 0 4px 0 var(--gray-mid); color: var(--gray-dark); cursor: not-allowed; }
  .btn-danger { background: var(--red); box-shadow: 0 4px 0 var(--red-dark); }
  .btn-danger:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-dark); }
  .btn-secondary {
    background: var(--bg); color: var(--gray-dark);
    border: 2px solid var(--gray); box-shadow: 0 4px 0 var(--gray);
  }
  .btn-secondary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gray); }

  /* =================== MODAIS =================== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 1rem;
    animation: fadeIn 0.25s; backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg); border-radius: 24px;
    padding: 2rem 1.5rem; max-width: 420px; width: 100%;
    text-align: center;
    animation: popIn 0.45s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal h2 { font-size: 1.6rem; color: var(--yellow); margin-bottom: 0.4rem; font-weight: 800; }
  .modal .stats-row { display: flex; justify-content: center; gap: 0.8rem; margin: 1.3rem 0; }
  .modal .stat-card { flex: 1; padding: 0.9rem 0.5rem; border-radius: 14px; border: 2px solid var(--gray); }
  .modal .stat-card .label {
    font-size: 0.68rem; text-transform: uppercase;
    color: var(--text-light); font-weight: 800; letter-spacing: 0.5px;
  }
  .modal .stat-card .value { font-size: 1.4rem; font-weight: 800; margin-top: 0.3rem; }
  .modal .stat-card.xp .value { color: var(--yellow); }
  .modal .stat-card.acc .value { color: var(--green); }
  .modal .stat-card.combo .value { color: var(--orange); }
  .modal .btn { width: 100%; margin-top: 0.6rem; }

  /* Conquistas no modal */
  .achievements-list {
    display: flex; flex-direction: column; gap: 0.5rem;
    margin: 1rem 0; text-align: left;
  }
  .achievement-toast {
    display: flex; align-items: center; gap: 0.7rem;
    background: var(--yellow-light); border: 2px solid var(--yellow);
    border-radius: 12px; padding: 0.7rem 0.9rem;
    animation: slideIn 0.5s;
  }
  [data-theme="dark"] .achievement-toast { background: #3d3100; }
  @keyframes slideIn {
    from { transform: translateX(-20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .achievement-toast .emoji { font-size: 1.8rem; }
  .achievement-toast .info strong { display: block; font-size: 0.9rem; color: var(--text); }
  .achievement-toast .info span { font-size: 0.75rem; color: var(--text-light); }

  /* =================== PERFIL / CONQUISTAS =================== */
  .profile-header {
    display: flex; flex-direction: column; align-items: center;
    gap: 0.7rem; padding: 1.5rem 0;
  }
  .avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: linear-gradient(135deg, var(--green), var(--blue));
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; box-shadow: 0 8px 20px rgba(88,204,2,0.3);
  }
  .profile-header h2 { font-size: 1.4rem; }
  .profile-header p { color: var(--text-light); font-size: 0.9rem; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 0.7rem; margin-bottom: 1.5rem;
  }
  .stat-box {
    background: var(--bg-alt); border-radius: 14px;
    padding: 1rem; text-align: center;
  }
  .stat-box .emoji { font-size: 1.8rem; }
  .stat-box .val { font-size: 1.4rem; font-weight: 800; color: var(--text); margin-top: 0.2rem; }
  .stat-box .lbl { font-size: 0.75rem; color: var(--text-light); font-weight: 700; text-transform: uppercase; }

  .achievements-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 0.7rem;
  }
  .achievement-card {
    background: var(--bg-alt); border-radius: 14px;
    padding: 0.9rem 0.5rem; text-align: center;
    border: 2px solid transparent; transition: all 0.2s;
  }
  .achievement-card.unlocked {
    background: linear-gradient(135deg, var(--yellow-light), #fff5cc);
    border-color: var(--yellow);
  }
  [data-theme="dark"] .achievement-card.unlocked { background: #3d3100; }
  .achievement-card .emoji { font-size: 1.8rem; filter: grayscale(1); opacity: 0.4; }
  .achievement-card.unlocked .emoji { filter: none; opacity: 1; }
  .achievement-card .name { font-size: 0.7rem; font-weight: 700; margin-top: 0.3rem; color: var(--text); }
  .achievement-card .desc { font-size: 0.62rem; color: var(--text-light); margin-top: 0.15rem; }

  /* =================== LIGAS =================== */
  .league-banner {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: white; border-radius: 20px;
    padding: 1.3rem; text-align: center; margin-bottom: 1rem;
  }
  .league-banner .trophy { font-size: 3rem; }
  .league-banner h3 { margin: 0.3rem 0; font-size: 1.3rem; }
  .leaderboard {
    background: var(--bg-alt); border-radius: 16px;
    padding: 0.5rem; margin-bottom: 1rem;
  }
  .lb-row {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.7rem 0.9rem; border-radius: 12px;
    margin-bottom: 0.3rem;
  }
  .lb-row.me { background: var(--green-light); border: 2px solid var(--green); }
  [data-theme="dark"] .lb-row.me { background: #1e3d0e; }
  .lb-row .rank { font-weight: 800; color: var(--text-light); width: 24px; }
  .lb-row .avatar-mini {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
  }

function carregar() {
  const raw = localStorage.getItem('lingualearn_v3');
  if (raw) {
    try {
      const u = JSON.parse(raw);
      state.usuario = { ...state.usuario, ...u };
      const hoje = new Date().toDateString();
      const ontem = new Date(Date.now() - 86400000).toDateString();
      if (state.usuario.lastPlayed && state.usuario.lastPlayed !== hoje && state.usuario.lastPlayed !== ontem) {
        state.usuario.streak = 0;
      }
    } catch(e) {}
  }
  atualizarTopbar();

  const pct = Math.round((completed / LESSONS_PER_LANG) * 100);

/* ================================================================
   SRS - SPACED REPETITION
   ================================================================ */
function getSRSKey(idiomaKey, frase) { return `${idiomaKey}::${frase.en}`; }

function getFrasesPrioritarias(idiomaKey) {
  const todas = IDIOMAS[idiomaKey].frases;
  const agora = Date.now();
  const devidas = [];
  const novas = [];
  const futuras = [];

  todas.forEach(f => {
    const key = getSRSKey(idiomaKey, f);
    const srs = state.usuario.srs[key];
    if (!srs) novas.push(f);
    else if (srs.nextReview <= agora) devidas.push(f);
    else futuras.push(f);
  });

  // Prioridade: devidas > novas > futuras
  return [...shuffle(devidas), ...shuffle(novas), ...shuffle(futuras)];
}

function atualizarSRS(idiomaKey, frase, acertou) {
  const key = getSRSKey(idiomaKey, frase);
  const atual = state.usuario.srs[key] || { level: 0, nextReview: 0 };
  let novoLevel = atual.level;

  if (acertou) {
    novoLevel = Math.min(atual.level + 1, 6);
    if (acertou) state.usuario.srsStats.correct++;
  } else {
    novoLevel = Math.max(0, atual.level - 1);
    state.usuario.srsStats.wrong++;
  }

  const intervalos = [0, 1, 4, 12, 24, 72, 168]; // horas
  const horas = intervalos[novoLevel] || 24;
  state.usuario.srs[key] = {
    level: novoLevel,
    nextReview: Date.now() + horas * 3600 * 1000
  };
}

/* ================================================================
   MOTOR DE EXERCÍCIOS (5 tipos)
   ================================================================ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function gerarExercicios(idiomaKey) {
  const frases = getFrasesPrioritarias(idiomaKey).slice(0, EXERCISES_PER_LESSON);
  const todas = IDIOMAS[idiomaKey].frases;

  return frases.map((frase, idx) => {
    // Rotaciona tipos: 0=pt->lang, 1=banco, 2=ouvir, 3=lang->pt, 4=digitar
    const tipos = ['multipla_pt2lang', 'banco', 'ouvir', 'multipla_lang2pt', 'digitar'];
    const tipo = tipos[idx % tipos.length];

    if (tipo === 'multipla_pt2lang') {
      const distratores = shuffle(todas.filter(f => f.en !== frase.en)).slice(0, 3).map(f => f.en);
      return {
        tipo: 'multipla', pergunta: frase.pt,
        perguntaLabel: 'Como se diz em ' + IDIOMAS[idiomaKey].nome + '?',
        correta: frase.en, opcoes: shuffle([frase.en, ...distratores]), frase
      };
    }
    if (tipo === 'multipla_lang2pt') {
      const distratores = shuffle(todas.filter(f => f.pt !== frase.pt)).slice(0, 3).map(f => f.pt);
      return {
        tipo: 'multipla', pergunta: frase.en,
        perguntaLabel: 'O que significa?',
        correta: frase.pt, opcoes: shuffle([frase.pt, ...distratores]), frase
      };
    }
    if (tipo === 'banco') {
      const palavrasCorretas = frase.en.split(/\s+/);
      const extras = [];
      shuffle(todas).forEach(f => {
        if (extras.length >= 3) return;
        const ws = f.en.split(/\s+/).filter(w => !palavrasCorretas.includes(w));
        ws.forEach(w => { if (extras.length < 3 && !extras.includes(w)) extras.push(w); });
      });
      return {
        tipo: 'banco', pergunta: frase.pt,
        perguntaLabel: 'Traduza para ' + IDIOMAS[idiomaKey].nome,
        correta: frase.en, banco: shuffle([...palavrasCorretas, ...extras]), frase
      };
    }
    if (tipo === 'ouvir') {
      const distratores = shuffle(todas.filter(f => f.pt !== frase.pt)).slice(0, 3).map(f => f.pt);
      return {
        tipo: 'ouvir', pergunta: frase.en,
        perguntaLabel: 'O que você ouviu?',
        correta: frase.pt, opcoes: shuffle([frase.pt, ...distratores]), frase
      };
    }
    // digitar
    return {
      tipo: 'digitar', pergunta: frase.pt,
      perguntaLabel: 'Digite em ' + IDIOMAS[idiomaKey].nome,
      correta: frase.en, frase
    };
  });
}

/* ================================================================
   LIÇÃO
   ================================================================ */
function iniciarLicao(idx) {
  if (state.usuario.hearts <= 0) { mostrarGameOver(); return; }

  const exercicios = gerarExercicios(state.idiomaAtual);
  state.licaoAtual = {
    exercicios, indice: 0, acertos: 0, total: exercicios.length,
    lessonIdx: idx, combo: 0, maxComboInLesson: 0, erros: 0
  };

  state.telaAtual = 'lesson';
  showScreen('lessonScreen');
  renderExercicio();
}

function renderExercicio() {
  const { exercicios, indice } = state.licaoAtual;
  if (indice >= exercicios.length) return finalizarLicao();

  const ex = exercicios[indice];
  const content = document.getElementById('lessonContent');
  const feedbackBox = document.getElementById('feedbackBox');
  const checkBtn = document.getElementById('checkBtn');
  feedbackBox.style.display = 'none';
  feedbackBox.className = 'feedback-box';
  checkBtn.textContent = 'Verificar';
  checkBtn.className = 'btn btn-primary';
  checkBtn.disabled = true;
  checkBtn.onclick = checkAnswer;

  const pct = (indice / exercicios.length) * 100;
  document.getElementById('lessonProgress').style.width = pct + '%';

  const comboHtml = state.licaoAtual.combo >= 3
    ? `<span class="combo-badge">🔥 ${state.licaoAtual.combo}x</span>`
    : '';

  let html = `
    <div class="lesson-sub">
      <span>L ${state.licaoAtual.lessonIdx + 1} · ${indice + 1}/${exercicios.length}</span>
      ${comboHtml}
    </div>
    <div class="exercise-prompt">
      <span class="icon">${ex.tipo === 'ouvir' ? '🎧' : ex.tipo === 'digitar' ? '⌨️' : ex.tipo === 'banco' ? '🧩' : '💭'}</span>
      <span>${ex.perguntaLabel}</span>
    </div>
  `;

  if (ex.tipo === 'multipla') {
    html += `<h2 style="font-size:1.5rem; margin:1rem 0 1.3rem; color:var(--text);">"${ex.pergunta}"</h2>`;
    html += `<div class="options">`;
    ex.opcoes.forEach((op, i) => {
      const letra = String.fromCharCode(65 + i);
      html += `<button class="option" data-value="${op.replace(/"/g, '&quot;')}" onclick="selecionarOpcao(this, '${op.replace(/'/g, "\\'")}')">
        <span class="num">${letra}</span><span>${op}</span>
      </button>`;
    });
    html += `</div>`;
  } else if (ex.tipo === 'ouvir') {
    html += `<button class="audio-btn-big" id="audioBtn" onclick="reproduzirAudio()">🔊</button>`;
    html += `<p style="text-align:center; color:var(--text-light); font-size:0.9rem; margin-bottom:1.2rem;">Toque para ouvir novamente</p>`;
    html += `<div class="options">`;
    ex.opcoes.forEach((op, i) => {
      const letra = String.fromCharCode(65 + i);
      html += `<button class="option" data-value="${op.replace(/"/g, '&quot;')}" onclick="selecionarOpcao(this, '${op.replace(/'/g, "\\'")}')">
        <span class="num">${letra}</span><span>${op}</span>
      </button>`;
    });
    html += `</div>`;
  } else if (ex.tipo === 'banco') {
    html += `<h2 style="font-size:1.4rem; margin:1rem 0 1.3rem; color:var(--text);">"${ex.pergunta}"</h2>`;
    html += `<div class="word-bank-area" id="wordBankArea"></div>`;
    html += `<div class="word-bank" id="wordBank">`;
    ex.banco.forEach((p, i) => {
      html += `<button class="word-chip" data-word="${p.replace(/"/g, '&quot;')}" data-idx="${i}" onclick="usarPalavra(this)">${p}</button>`;
    });
    html += `</div>`;
  } else if (ex.tipo === 'digitar') {
    html += `<h2 style="font-size:1.4rem; margin:1rem 0 1.3rem; color:var(--text);">"${ex.pergunta}"</h2>`;
    html += `<input type="text" class="type-input" id="typeInput" placeholder="Digite a tradução..." autocomplete="off" autocapitalize="off" spellcheck="false" oninput="onTypeInput()">`;
  }

  content.innerHTML = html;

  if (ex.tipo === 'ouvir') {
    setTimeout(() => reproduzirAudio(), 400);
  }
  if (ex.tipo === 'digitar') {
    setTimeout(() => document.getElementById('typeInput').focus(), 200);
  }
}

function reproduzirAudio() {
  const { exercicios, indice } = state.licaoAtual;
  const ex = exercicios[indice];
  const btn = document.getElementById('audioBtn');
  if (btn) {
    btn.classList.add('playing');
    setTimeout(() => btn.classList.remove('playing'), 1200);
  }
  falar(ex.pergunta);
}

let respostaSelecionada = null;
let palavrasUsadas = [];

function selecionarOpcao(btn, valor) {
  if (btn.disabled || document.getElementById('checkBtn').textContent === 'Continuar') return;
  document.querySelectorAll('.option').forEach(o => {
    o.style.borderColor = '';
    o.style.background = '';
  });
  btn.style.borderColor = 'var(--blue)';
  btn.style.background = 'var(--bg-alt)';
  respostaSelecionada = valor;
  document.getElementById('checkBtn').disabled = false;
}

function usarPalavra(btn) {
  if (btn.classList.contains('used')) return;
  btn.classList.add('used');
  palavrasUsadas.push({ word: btn.dataset.word, idx: btn.dataset.idx });
  renderWordBankArea();
  document.getElementById('checkBtn').disabled = palavrasUsadas.length === 0;
}

function removerPalavra(idx) {
  palavrasUsadas = palavrasUsadas.filter(p => p.idx !== idx);
  document.querySelectorAll('.word-chip').forEach(c => {
    if (c.dataset.idx === String(idx)) c.classList.remove('used');
  });
  renderWordBankArea();
  document.getElementById('checkBtn').disabled = palavrasUsadas.length === 0;
}

function renderWordBankArea() {
  const area = document.getElementById('wordBankArea');
  if (!area) return;
  area.innerHTML = palavrasUsadas.map(p =>
    `<button class="word-chip placed" onclick="removerPalavra('${p.idx}')">${p.word}</button>`
  ).join('');
}

function onTypeInput() {
  const inp = document.getElementById('typeInput');
  document.getElementById('checkBtn').disabled = inp.value.trim().length === 0;
}

/* ================================================================
   VERIFICAR RESPOSTA
   ================================================================ */
function checkAnswer() {
  const { exercicios, indice } = state.licaoAtual;
  const ex = exercicios[indice];
  let resposta = '';
  let correta = false;

  if (ex.tipo === 'multipla' || ex.tipo === 'ouvir') {
    resposta = respostaSelecionada || '';
    correta = resposta === ex.correta;
    document.querySelectorAll('.option').forEach(btn => {
      btn.disabled = true;
      const val = btn.dataset.value;
      if (val === ex.correta) btn.classList.add('correct');
      else if (respostaSelecionada === val && val !== ex.correta) btn.classList.add('wrong');
      btn.style.borderColor = '';
      btn.style.background = '';
    });
  } else if (ex.tipo === 'banco') {
    resposta = palavrasUsadas.map(p => p.word).join(' ');
    correta = normalizar(resposta) === normalizar(ex.correta);
    document.querySelectorAll('.word-chip').forEach(c => c.disabled = true);
  } else if (ex.tipo === 'digitar') {
    const inp = document.getElementById('typeInput');
    resposta = inp.value.trim();
    correta = normalizar(resposta) === normalizar(ex.correta);
    inp.classList.add(correta ? 'correct' : 'wrong');
    inp.disabled = true;
  }

  atualizarSRS(state.idiomaAtual, ex.frase, correta);

  const fb = document.getElementById('feedbackBox');
  const icon = document.getElementById('feedbackIcon');
  const text = document.getElementById('feedbackText');
  const sub = document.getElementById('feedbackSub');
  fb.style.display = 'flex';

  if (correta) {
    state.licaoAtual.acertos++;
    state.licaoAtual.combo++;
    if (state.licaoAtual.combo > state.licaoAtual.maxComboInLesson) {
      state.licaoAtual.maxComboInLesson = state.licaoAtual.combo;
    }
    if (state.licaoAtual.combo > state.usuario.maxCombo) {
      state.usuario.maxCombo = state.licaoAtual.combo;
    }
    fb.classList.add('correct');
    icon.textContent = '✅';
    text.textContent = 'Muito bem!';
    const frases = ['Boa!', 'Continue assim!', 'Excelente!', 'Você consegue!', 'Arrasou!', 'Perfeito!'];
    sub.textContent = state.licaoAtual.combo >= 3
      ? `🔥 Combo x${state.licaoAtual.combo}! ${shuffle(frases)[0]}`
      : shuffle(frases)[0];
    tocarSom('correct');
    burstStars();
  } else {
    state.licaoAtual.erros++;
    state.licaoAtual.combo = 0;
    state.usuario.hearts = Math.max(0, state.usuario.hearts - 1);
    atualizarTopbar(); salvar();
    fb.classList.add('wrong');
    icon.textContent = '❌';
    text.textContent = 'Resposta correta:';
    sub.textContent = ex.correta;
    tocarSom('wrong');
    document.querySelector('.lesson-content').classList.add('shake');
    setTimeout(() => document.querySelector('.lesson-content').classList.remove('shake'), 500);
  }

  const btn = document.getElementById('checkBtn');
  btn.textContent = 'Continuar';
  btn.className = correta ? 'btn btn-primary' : 'btn btn-danger';
  btn.disabled = false;
  btn.onclick = proximoExercicio;

  if (state.usuario.hearts <= 0) setTimeout(() => mostrarGameOver(), 1500);
}

function normalizar(s) {
  return s.toLowerCase()
    .replace(/[¿?¡!.,;:]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function proximoExercicio() {
  state.licaoAtual.indice++;
  respostaSelecionada = null;
  palavrasUsadas = [];
  renderExercicio();
}

/* ================================================================
   FINALIZAR LIÇÃO
   ================================================================ */
function finalizarLicao() {
  const { acertos, total, lessonIdx, maxComboInLesson } = state.licaoAtual;
  const xpBase = acertos * 5;
  const bonusCombo = maxComboInLesson >= 5 ? 10 : 0;
  const bonusPerfeito = acertos === total ? 15 : 0;
  const xpGanho = xpBase + bonusCombo + bonusPerfeito;
  const precisao = Math.round((acertos / total) * 100);

  state.usuario.xp += xpGanho;
  state.usuario.gems += Math.floor(xpGanho / 10);

  if (precisao === 100) state.usuario.perfectLessons++;

  const hora = new Date().getHours();
  if (hora >= 22 || hora < 5) state.usuario.nightOwl = true;

  if (!state.usuario.progresso[state.idiomaAtual]) state.usuario.progresso[state.idiomaAtual] = [];
  if (precisao >= 60) state.usuario.progresso[state.idiomaAtual][lessonIdx] = true;

  const hoje = new Date().toDateString();
  const ontem = new Date(Date.now() - 86400000).toDateString();
  if (state.usuario.lastPlayed !== hoje) {
    if (state.usuario.lastPlayed === ontem) state.usuario.streak++;
    else state.usuario.streak = 1;
    state.usuario.lastPlayed = hoje;
  }

  // Verificar conquistas novas
  const novasConquistas = [];
  CONQUISTAS.forEach(c => {
    if (!state.usuario.conquistas.includes(c.id) && c.check(state.usuario)) {
      state.usuario.conquistas.push(c.id);
      novasConquistas.push(c);
    }
  });

  atualizarTopbar();
  salvar();

  // Preencher modal
  document.getElementById('resultXP').textContent = '+' + xpGanho;
  document.getElementById('resultAcc').textContent = precisao + '%';
  document.getElementById('resultCombo').textContent = 'x' + maxComboInLesson;

  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');

  if (precisao === 100) {
    icon.textContent = '🏆';
    title.textContent = 'PERFEITO!';
    sub.textContent = 'Você acertou tudo! Incrível!';
    if (!state.usuario.conquistas.includes('perfect')) {}
  } else if (precisao >= 80) {
    icon.textContent = '🌟';
    title.textContent = 'Excelente!';
    sub.textContent = 'Você está indo muito bem!';
  } else if (precisao >= 60) {
    icon.textContent = '🎉';
    title.textContent = 'Lição Completa!';
    sub.textContent = 'Bom trabalho!';
  } else {
    icon.textContent = '💪';
    title.textContent = 'Continue tentando!';
    sub.textContent = 'Você vai conseguir!';
  }

  // Conquistas no modal
  const achList = document.getElementById('achievementsUnlocked');
  if (novasConquistas.length > 0) {
    achList.innerHTML = novasConquistas.map(c => `
      <div class="achievement-toast">
        <span class="emoji">${c.emoji}</span>
        <div class="info">
          <strong>🏅 Nova conquista!</strong>
          <span>${c.nome} — ${c.desc}</span>
        </div>
      </div>
    `).join('');
  } else {
    achList.innerHTML = '';
  }

  document.getElementById('resultModal').classList.add('active');

  if (precisao >= 60) {
    soltarConfetes(80);
    tocarSom('complete');
  }
}

function closeResult() {
  document.getElementById('resultModal').classList.remove('active');
  state.telaAtual = 'trail';
  renderTrail();
  showScreen('trailScreen');
}

/* ================================================================
   GAME OVER
   ================================================================ */
function mostrarGameOver() {
  const modal = document.getElementById('resultModal');
  document.getElementById('resultIcon').textContent = '💔';
  document.getElementById('resultTitle').textContent = 'Sem corações!';
  document.getElementById('resultSub').textContent = 'Recupere para continuar aprendendo.';
  document.getElementById('resultXP').textContent = '—';
  document.getElementById('resultAcc').textContent = '—';
  document.getElementById('resultCombo').textContent = '—';
  document.getElementById('achievementsUnlocked').innerHTML = '';

  const btnContinuar = modal.querySelector('.btn');
  btnContinuar.textContent = 'Voltar';

  if (!document.getElementById('restoreBtn')) {
    const b = document.createElement('button');
    b.id = 'restoreBtn';
    b.className = 'btn btn-secondary';
    b.style.marginTop = '0.6rem';
    b.textContent = '💎 Usar 10 gemas';
    b.onclick = () => {
      if (state.usuario.gems < 10) {
        alert('Você precisa de 10 gemas! 💎');
        return;
      }
      state.usuario.gems -= 10;
      state.usuario.hearts = 5;
      atualizarTopbar(); salvar();
      modal.classList.remove('active');
      closeResult();
    };
    modal.appendChild(b);
  }
  modal.classList.add('active');
}

/* ================================================================
   ÁUDIO E SONS
   ================================================================ */
function falar(texto) {
  if (!('speechSynthesis' in window)) { return; }
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = IDIOMAS[state.idiomaAtual]?.code || 'en-US';
  utter.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

let audioCtx = null;
function tocarSom(tipo) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = {
      correct: [523.25, 659.25, 783.99],
      wrong: [392, 311.13],
      complete: [523.25, 659.25, 783.99, 1046.5]
    }[tipo] || [440];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.09 + 0.22);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * 0.09);
      osc.stop(audioCtx.currentTime + i * 0.09 + 0.28);
    });
  } catch(e) {}
}

function burstStars() {
  const colors = ['⭐', '✨', '🌟', '💫'];
  for (let i = 0; i < 4; i++) {
    const s = document.createElement('div');
    s.className = 'star-burst';
    s.textContent = colors[Math.floor(Math.random() * colors.length)];
    const rect = document.getElementById('checkBtn').getBoundingClientRect();
    s.style.left = rect.left + 'px';
    s.style.top = rect.top + 'px';
    s.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
    s.style.setProperty('--ty', (-Math.random() * 150 - 50) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function soltarConfetes(qtd = 50) {
  const colors = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#ce82ff', '#ff9600'];
  for (let i = 0; i < qtd; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.6 + 's';
    c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    c.style.width = (6 + Math.random() * 10) + 'px';
    c.style.height = c.style.width;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

    <div class="stat-box"><div class="emoji">🏆</div><div class="val">${u.perfectLessons || 0}</div><div class="lbl">Perfeitas</div></div>
    <div class="stat-box"><div class="emoji">📖</div><div class="val">${Object.keys(u.srs).length}</div><div class="lbl">SRS</div></div>

/* ================================================================
   LIGA (Leaderboard fake + você)

function renderLiga() {
  const ligas = [
    { nome: 'Bronze', emoji: '🥉', min: 0 },
    { nome: 'Prata', emoji: '🥈', min: 100 },
    { nome: 'Ouro', emoji: '🥇', min: 300 },

    { nome: 'Rubi', emoji: '🔴', min: 1500 }
  ];
  const u = state.usuario;
  let ligaAtual = ligas[0];
  for (const l of ligas) if (u.xp >= l.min) ligaAtual = l;

  document.getElementById('leagueBanner').innerHTML = `
    <div class="trophy">${ligaAtual.emoji}</div>
    <h3>Liga ${ligaAtual.nome}</h3>
    <p style="opacity: 0.9; font-size: 0.85rem;">${u.xp} XP esta semana</p>

  // Bots com XP variável (reproduzível)

  const bots = [
    { nome: 'Sofia', avatar: '🦊', xp: 320 + (seed % 80) },
    { nome: 'Miguel', avatar: '🐼', xp: 280 + (seed % 60) },
    { nome: 'Ana', avatar: '🐨', xp: 250 + (seed % 50) },
    { nome: 'Você', avatar: '🦉', xp: u.xp, me: true },
    { nome: 'Lucas', avatar: '🦁', xp: Math.max(50, 150 + (seed % 40) - 30) },
    { nome: 'Bia', avatar: '🐰', xp: Math.max(30, 100 + (seed % 30) - 20) },
    { nome: 'Pedro', avatar: '🐸', xp: 80 + (seed % 25) },
    { nome: 'Júlia', avatar: '🐧', xp: 60 + (seed % 20) }
  ];

  const ranking = bots.sort((a, b) => b.xp - a.xp);
  document.getElementById('leaderboard').innerHTML = ranking.map((p, i) => `
    <div class="lb-row ${p.me ? 'me' : ''}">
      <div class="rank">${i + 1}º</div>
      <div class="avatar-mini">${p.avatar}</div>
      <div class="name">${p.nome}</div>
      <div class="xp">⚡ ${p.xp}</div>
    </div>
  `).join('');
}

/* ================================================================
   TEMA
   ================================================================ */
function toggleTheme() {
  const atual = document.body.dataset.theme;
  const novo = atual === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = novo;
  localStorage.setItem('lingualearn_theme', novo);
}

function carregarTema() {
  const salvo = localStorage.getItem('lingualearn_theme');
  if (salvo) document.body.dataset.theme = salvo;
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.body.dataset.theme = 'dark';
  }
}

carregarTema();
carregar();
renderHome();

// Registra service worker inline para PWA
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // SW simples para cache
  const swCode = `
    const CACHE = 'lingualearn-v3';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
          const copy = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, copy));
          return resp;
        }).catch(() => caches.match('./')))
      );
    });
  `;
  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  } catch(e) {}
}
